spring.application.name=exchange-rate-realtime

# ======================
# KAFKA
# ======================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=tp-kafka-step1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.learn.kafka.domain.model.ExchangeRateMessage

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ======================
# ELASTICSEARCH
# ======================
spring.elasticsearch.uris=http://localhost:9200
spring.data.elasticsearch.repositories.enabled=true

# ======================
# APPLICATION
# ======================
app.kafka.messages-topic=exchange-rates

# URL de l'API externe de taux de change (configurable par environnement)
app.exchange-api.url=https://api.exchangerate-api.com/v4/latest/USD

# Scheduler : activer/désactiver et fréquence en millisecondes (défaut : 5 min)
app.scheduler.enabled=true
app.scheduler.fixed-rate-ms=30000
